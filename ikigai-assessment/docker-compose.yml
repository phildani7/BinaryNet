version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: ikigai_postgres
    environment:
      POSTGRES_DB: ikigai_db
      POSTGRES_USER: ikigai_user
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikigai_user -d ikigai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and Celery
  redis:
    image: redis:7-alpine
    container_name: ikigai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LiveKit server (self-hosted option)
  livekit:
    image: livekit/livekit-server:latest
    container_name: ikigai_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}

  # API server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikigai_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ikigai_user:${DATABASE_PASSWORD:-changeme}@postgres:5432/ikigai_db
      - REDIS_URL=redis://redis:6379/0
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery worker for async scoring
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikigai_celery
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://ikigai_user:${DATABASE_PASSWORD:-changeme}@postgres:5432/ikigai_db
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - .:/app
      - ./data:/data
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Visualization dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ikigai_dashboard
    command: python src/visualization/app.py
    ports:
      - "8050:8050"
    environment:
      - DATABASE_URL=postgresql://ikigai_user:${DATABASE_PASSWORD:-changeme}@postgres:5432/ikigai_db
    volumes:
      - .:/app
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
